# BAM Option B: Bloom Static Scattered Mask (BloomMaskHead) — BGE-base
#
# Routing: Embedding(6, 768) → Gumbel-Sigmoid + STE → scattered binary mask per Bloom level
# One fixed mask per Bloom level. Active dims are scattered — NOT FAISS sub-index compatible.
#
# Run 11 — reverse two-stage: frozen mask learning → gentle encoder fine-tuning
#
#   E5-large run 5 finding: reverse two-stage training (frozen 8 epochs → unfreeze at 1e-6)
#   beat both MRL and Option A on ALL metrics. Encoder quality preserved during mask
#   convergence, then gently adapted to complement the converged mask.
#
#   Applying same strategy to BGE-base (768 dims):
#     Stage 1 [epochs 0-7]: Encoder FROZEN. Only BloomMaskHead trains.
#     Stage 2 [epochs 8-19]: Encoder unfreezes at 1e-6 LR.
#
#   Per-level targets (matched to Option A's distribution):
#     Remember:   0.30 → 230 dims  (Option A: 230)
#     Understand: 0.56 → 430 dims  (Option A: 432)
#     Apply:      0.27 → 207 dims  (Option A: 205)
#     Analyze:    0.28 → 215 dims  (Option A: 216)
#     Evaluate:   0.56 → 430 dims  (Option A: 432)
#     Create:     0.27 → 207 dims  (Option A: 207)
#     Average:    0.37 → 287 dims  (Option A: 234)

model:
  backbone: "BAAI/bge-base-en-v1.5"
  embedding_dim: 768
  pooling: "cls"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 384, 512, 768]
  use_mask_routing: true             # Option B: BloomMaskHead scattered mask
  mask_sparsity_target: null          # Using per-level targets (mask_level_targets below).
                                     # Global target overridden when per-level targets provided.
  use_soft_bloom_routing: false      # N/A for Option B

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 15

training:
  seed: 42
  num_epochs: 20                   # 8 frozen + 12 fine-tuning
  batch_size: 16
  gradient_accumulation_steps: 8
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-4                     # Default LR (mask uses router_lr)
    weight_decay: 0.01
    encoder_lr: 2.0e-5             # Used by get_parameter_groups when not frozen
    router_lr: 2.0e-4              # BloomMaskHead LR
    encoder_finetune_lr: 1.0e-6    # Stage 2: conservative encoder fine-tuning
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  loss:
    contrastive_weight: 1.0
    efficiency_weight: 0.0         # OFF — sparsity targets handle compression
    efficiency_uniform_weights: true
    mrl_anchor_weight: 0.0         # No prefix structure for scattered masks
    diversity_weight: 0.0          # RouterDiversityLoss is for Option A only
    mask_sparsity_weight: 1.0      # Strong enforcement of per-level targets
    mask_level_targets:            # Matched to Option A's learned dim distribution
      0: 0.30                      # Remember: 230 dims (A: 230)
      1: 0.56                      # Understand: 430 dims (A: 432)
      2: 0.27                      # Apply: 207 dims (A: 205)
      3: 0.28                      # Analyze: 215 dims (A: 216)
      4: 0.56                      # Evaluate: 430 dims (A: 432)
      5: 0.27                      # Create: 207 dims (A: 207)
    mask_diversity_weight: 0.5     # Push masks apart per Bloom level
    mask_diversity_margin: 0.0
    mask_variance_weight: 0.3      # Per-dim variance across levels
    mask_distill_weight: 0.5       # Strong quality preservation (proven in e5-large run 5)
    dropmask_rate: 0.0             # OFF — encoder frozen in stage 1
    dim_redist_weight: 0.0         # OFF — encoder frozen in stage 1
    encoder_warmup_epochs: 0       # All losses active from epoch 0
    mask_differentiation_epochs: 0 # All losses active from epoch 0
    temperature_schedule:
      start: 0.1
      end: 0.02
    gumbel_temperature_schedule:
      start: 1.0
      end: 0.1
    # bloom_frequencies injected at runtime by train_bam.py
  use_pcgrad: false
  encoder_freeze_after_epochs: null
  encoder_unfreeze_after_epochs: 8 # Stage 2: unfreeze encoder at epoch 8
  bloom_noise_rate: 0.0
  hard_neg_refresh_epochs: null
  checkpoint_dir: "/tmp/bam-b-ckpts11/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true
  tail_topic_threshold: 20
  measure_latency: true

diagnostics:
  gradient_attribution: true
  num_diagnostic_queries: 1000
  probing:
    probe_type: "linear"
    probe_tasks: ["bloom_level", "subject_area"]
    num_dimension_groups: 8

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
