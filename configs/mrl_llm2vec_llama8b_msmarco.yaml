# MRL Baseline — LLM2Vec-Meta-Llama-3-8B backbone — MS MARCO

model:
  backbone: "McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp"
  backbone_type: "llm2vec"
  peft_model_name: "McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp-supervised"
  embedding_dim: 4096
  pooling: "mean"
  normalize_embeddings: true
  mrl_dims: [256, 512, 1024, 2048, 3072, 4096]
  torch_dtype: "bfloat16"

data:
  train_path: "/tmp/data/msmarco/train.jsonl"
  val_path: "/tmp/data/msmarco/val.jsonl"
  test_path: "/tmp/data/msmarco/test.jsonl"
  corpus_path: "/tmp/data/msmarco/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["general"]
  max_query_length: 64
  max_passage_length: 128
  num_hard_negatives: 15

training:
  seed: 42
  num_epochs: 15
  batch_size: 4
  gradient_accumulation_steps: 32
  fp16: false
  bf16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-5
    weight_decay: 0.01
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  encoder_freeze_after_epochs: 0
  checkpoint_dir: "/tmp/mrl-llm2vec-llama8b-msmarco-ckpts/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  eval_batch_size: 16
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
