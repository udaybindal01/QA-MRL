# BAM Option B: Qwen2.5-7B backbone, MRL warm-start
#
# Routing: Embedding(6, 3584) → Gumbel-Sigmoid + STE → scattered binary mask per Bloom level
# One fixed mask per Bloom level. Active dims are scattered — NOT FAISS sub-index compatible.
#
# Init encoder: /tmp/mrl-qwen7b-ckpts/best (run mrl_qwen7b training first).
# MRL warm-start used (same as BGE Option B): domain adaptation benefit outweighs any prefix
# bias cost, since mrl_anchor_weight=0.0 prevents the encoder being re-pulled toward prefix
# structure during Option B training.
#
# Key differences from BGE-base Option B config:
#   - backbone: Qwen/Qwen2.5-7B (3584 hidden dim, decoder-only)
#   - pooling: "mean" (no CLS token in decoder-only architecture)
#   - num_epochs: 25 (MRL init, but 7B convergence is slower than BGE-base)
#   - encoder_warmup_epochs: 8 (larger model, more warmup before compression)
#   - batch_size: 4 + grad_accum 32 → effective batch 128 (7B model memory constraint)
#   - encoder_lr: 1e-5 (vs 2e-5) — lower LR for large model stability
#   - mrl_dims: scaled to [256, 512, 1024, 1792, 2560, 3584] (~same ratios as BGE config)
#
# Per-level sparsity targets: same fractions as BGE run 10.
# BloomMaskHead Embedding is now (6, 3584) — initialized with Φ⁻¹(target) per level.
#
# Run 1 (Qwen7B base init)

model:
  backbone: "Qwen/Qwen2.5-7B"
  embedding_dim: 3584
  pooling: "mean"                  # decoder-only: no CLS token, use mean over non-padding
  normalize_embeddings: true
  mrl_dims: [256, 512, 1024, 1792, 2560, 3584]
  use_mask_routing: true           # Option B: BloomMaskHead scattered mask
  mask_sparsity_target: null       # Using per-level targets below
  use_soft_bloom_routing: false    # N/A for Option B

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 7

training:
  seed: 42
  num_epochs: 25
  batch_size: 1                    # 7B model on 44GB: batch 1 avoids OOM; grad_accum compensates
  gradient_accumulation_steps: 128 # effective batch = 1 * 128 = 128 (matches BGE effective batch)
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 1.0e-5
    weight_decay: 0.01
    encoder_lr: 1.0e-5             # Lower than BGE (2e-5) — large model needs stable LR
    router_lr: 1.0e-4              # BloomMaskHead — 10x encoder LR
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  loss:
    contrastive_weight: 1.0
    efficiency_weight: 0.3
    efficiency_uniform_weights: true
    mrl_anchor_weight: 0.0         # 0: MRL anchor reinforces prefix structure — wrong for scatter
    diversity_weight: 0.0          # RouterDiversityLoss is for Option A only
    mask_sparsity_weight: 1.0      # Strong enforcement of per-level targets
    mask_level_targets:            # Same fractions as BGE run 10, scaled to 3584:
      0: 0.30                      # Remember: ~1075 dims
      1: 0.56                      # Understand: ~2007 dims
      2: 0.27                      # Apply: ~968 dims
      3: 0.28                      # Analyze: ~1004 dims
      4: 0.56                      # Evaluate: ~2007 dims
      5: 0.27                      # Create: ~968 dims
    mask_diversity_weight: 0.5
    mask_diversity_margin: 0.0
    mask_variance_weight: 0.3
    mask_distill_weight: 0.3
    encoder_warmup_epochs: 8       # Cold start: more warmup before compression kicks in
    mask_differentiation_epochs: 8
    temperature_schedule:
      start: 0.1
      end: 0.02
    gumbel_temperature_schedule:
      start: 1.0
      end: 0.1
  use_pcgrad: false
  encoder_freeze_after_epochs: null
  bloom_noise_rate: 0.0
  hard_neg_refresh_epochs: null
  checkpoint_dir: "/tmp/bam-b-qwen7b-ckpts/"
  save_every_n_steps: 500          # Save more frequently — slower training, don't want to lose runs
  eval_every_n_steps: 250

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true
  tail_topic_threshold: 20
  measure_latency: true

diagnostics:
  gradient_attribution: true
  num_diagnostic_queries: 1000
  probing:
    probe_type: "linear"
    probe_tasks: ["bloom_level", "subject_area"]
    num_dimension_groups: 8

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
