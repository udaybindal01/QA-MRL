# Standard Fine-tuning Baseline — intfloat/e5-large-v2 — MS MARCO
# mrl_dims: [1024] only → standard contrastive loss, no Matryoshka.
# Isolates: does MRL structure add value over plain domain fine-tuning?

data:
  bloom_levels:
    1: Remember
    2: Understand
    3: Apply
    4: Analyze
    5: Evaluate
    6: Create
  corpus_path: /tmp/data/msmarco/corpus.jsonl
  max_passage_length: 256
  max_query_length: 128
  num_hard_negatives: 15
  subjects:
  - general
  test_path: /tmp/data/msmarco/test.jsonl
  train_path: /tmp/data/msmarco/train.jsonl
  val_path: /tmp/data/msmarco/val.jsonl
evaluation:
  bloom_stratified: true
  retrieval_ks:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
logging:
  log_every_n_steps: 10
  use_wandb: true
  wandb_entity: null
  wandb_project: bam-emnlp
model:
  backbone: intfloat/e5-large-v2
  embedding_dim: 1024
  mrl_dims:
  - 1024
  normalize_embeddings: true
  pooling: cls
training:
  batch_size: 16
  checkpoint_dir: /tmp/standard-ft-e5large-msmarco-ckpts/
  eval_every_n_steps: 500
  fp16: true
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  num_epochs: 15
  optimizer:
    lr: 2.0e-05
    type: adamw
    weight_decay: 0.01
  save_every_n_steps: 1000
  scheduler:
    type: cosine
    warmup_ratio: 0.1
  seed: 42
