# MRL Baseline — jinaai/jina-embeddings-v3 backbone
#
# Jina-v3: 570M params, 1024-dim, mean pooling, long context (8192).
# Natively MRL-trained at [32, 64, 128, 256, 512, 768, 1024]. We fine-tune at
# [64, 128, 256, 512, 768, 1024] for consistency with other 1024-dim backbones.
# Largest backbone in 12GB study — batch_size=8 + grad_accum=16 (effective 128).
#
# Requires trust_remote_code (auto-detected by encoder.py).

model:
  backbone: "jinaai/jina-embeddings-v3"
  backbone_type: "standard"
  embedding_dim: 1024
  pooling: "mean"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 512, 768, 1024]
  torch_dtype: "bfloat16"

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 15

training:
  seed: 42
  num_epochs: 15
  batch_size: 8
  gradient_accumulation_steps: 16
  fp16: false
  bf16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-5
    weight_decay: 0.01
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  checkpoint_dir: "/tmp/mrl-jinav3-ckpts/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
