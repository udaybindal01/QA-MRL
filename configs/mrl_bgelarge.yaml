# MRL Baseline — BAAI/bge-large-en-v1.5 backbone
# Used as warm-start encoder for Option A and Option B (BGE-large runs).
#
# Key differences from BGE-base MRL (configs/neurips.yaml):
#   - backbone: BAAI/bge-large-en-v1.5 (1024 hidden dim, encoder-only, CLS pooling)
#   - embedding_dim: 1024
#   - mrl_dims: scaled to 1024 — same 6 checkpoints as BGE-base at ~same dim ratios
#   - Everything else identical (same LR, batch, epochs) — model is 335M params,
#     fits trivially on any GPU (~5 GB total training memory in FP32+Adam)
#
# Run 1

model:
  backbone: "BAAI/bge-large-en-v1.5"
  embedding_dim: 1024
  pooling: "cls"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 512, 768, 1024]

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 7

training:
  seed: 42
  num_epochs: 15
  batch_size: 16
  gradient_accumulation_steps: 8
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-5
    weight_decay: 0.01
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  checkpoint_dir: "/tmp/mrl-bgelarge-ckpts/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
