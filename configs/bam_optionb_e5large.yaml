# BAM Option B — intfloat/e5-large-v2 backbone, FROZEN MRL encoder
#
# Routing: Embedding(6, 1024) → Gumbel-Sigmoid + STE → scattered binary mask per Bloom level
# One fixed mask per Bloom level. Active dims are scattered — NOT FAISS sub-index compatible.
#
# Init encoder: /tmp/mrl-e5large-ckpts/best  (run mrl_e5large training first)
# Encoder: FROZEN (--freeze_encoder flag). Only BloomMaskHead trains.
#
# Run 4 — frozen encoder: learn masks on top of preserved MRL quality
#
#   Run 3 findings (R@10):  Option A=0.5627, Option B=0.5250, MRL=0.5315
#     BAM encoder at full 1024 dims: R@10=0.3236 — catastrophic degradation from MRL's 0.5315.
#     The combined loss stack (contrastive + efficiency + sparsity + diversity + variance +
#     distillation + redistribution + dropmask) destroyed encoder quality. The mask partially
#     recovered it (0.5250) but cannot fully compensate for a broken encoder.
#
#   Root cause: encoder is optimized through constantly-changing masks + aggressive DropMask +
#     redistribution loss that pushes information away from prefix dims (where MRL PUT it).
#     6 different loss signals create unstable gradients that degrade the encoder.
#
#   Run 4 strategy: FREEZE the encoder, train ONLY the BloomMaskHead.
#     - MRL encoder quality (R@10=0.5315 at full dims) is preserved.
#     - Mask learns which subset of high-quality dims to select per Bloom level.
#     - No DropMask needed (encoder is frozen — can't redistribute information).
#     - No redistribution loss needed (same reason).
#     - Simplified loss: contrastive + sparsity + diversity + distillation.
#     - Fewer epochs needed — only ~6K mask params to train.
#
#   Per-level targets (same as run 3):
#       Remember:   0.40 → ~410 dims
#       Understand: 0.65 → ~666 dims
#       Apply:      0.38 → ~389 dims
#       Analyze:    0.40 → ~410 dims
#       Evaluate:   0.65 → ~666 dims
#       Create:     0.38 → ~389 dims
#       Average:    ~488 dims (48% compression vs 1024)

model:
  backbone: "intfloat/e5-large-v2"
  embedding_dim: 1024
  pooling: "cls"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 512, 768, 1024]
  use_mask_routing: true             # Option B: BloomMaskHead scattered mask
  mask_sparsity_target: null         # Using per-level targets below
  use_soft_bloom_routing: false      # N/A for Option B

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 7

training:
  seed: 42
  num_epochs: 15                   # Fewer epochs — only ~6K mask params to train
  batch_size: 16
  gradient_accumulation_steps: 8   # effective batch = 128
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-4                     # Only mask trains — use router-level LR
    weight_decay: 0.01
    encoder_lr: 2.0e-5             # Irrelevant (frozen) but kept for compatibility
    router_lr: 2.0e-4              # BloomMaskHead — only trainable component
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  loss:
    contrastive_weight: 1.0        # Primary signal — mask learns which dims preserve quality
    efficiency_weight: 0.0         # OFF — sparsity targets handle compression;
                                   # efficiency was adding redundant pressure in runs 2-3.
    efficiency_uniform_weights: true
    mrl_anchor_weight: 0.0         # 0: MRL anchor reinforces prefix structure — wrong for scatter
    diversity_weight: 0.0          # RouterDiversityLoss is for Option A only
    mask_sparsity_weight: 1.0      # Strong enforcement of per-level targets
    mask_level_targets:            # Same targets as run 3
      0: 0.40                      # Remember: ~410 dims
      1: 0.65                      # Understand: ~666 dims
      2: 0.38                      # Apply: ~389 dims
      3: 0.40                      # Analyze: ~410 dims
      4: 0.65                      # Evaluate: ~666 dims
      5: 0.38                      # Create: ~389 dims
    mask_diversity_weight: 0.5     # Push masks apart — different dim selection per level
    mask_diversity_margin: 0.0
    mask_variance_weight: 0.3      # Per-dim variance — each dim "owned" by specific levels
    mask_distill_weight: 0.5       # Preserve full-space similarity structure in masked subspace
    dropmask_rate: 0.0             # OFF — encoder is frozen, can't redistribute information.
                                   # DropMask only helps when encoder can adapt to it.
    dim_redist_weight: 0.0         # OFF — encoder is frozen, redistribution has no effect.
    encoder_warmup_epochs: 0       # No warmup — encoder is frozen, all losses activate immediately
    mask_differentiation_epochs: 0 # No staged differentiation — mask-only training is simple enough
    temperature_schedule:
      start: 0.1
      end: 0.02
    gumbel_temperature_schedule:
      start: 1.0
      end: 0.1
    # bloom_frequencies injected at runtime by train_bam.py
  use_pcgrad: false
  encoder_freeze_after_epochs: null
  bloom_noise_rate: 0.0
  hard_neg_refresh_epochs: null
  checkpoint_dir: "/tmp/bam-b-e5large-ckpts4/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true
  tail_topic_threshold: 20
  measure_latency: true

diagnostics:
  gradient_attribution: true
  num_diagnostic_queries: 1000
  probing:
    probe_type: "linear"
    probe_tasks: ["bloom_level", "subject_area"]
    num_dimension_groups: 8

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
