# BAM Option B — intfloat/e5-large-v2 backbone, MRL warm-start
#
# Routing: Embedding(6, 1024) → Gumbel-Sigmoid + STE → scattered binary mask per Bloom level
# One fixed mask per Bloom level. Active dims are scattered — NOT FAISS sub-index compatible.
#
# Init encoder: /tmp/mrl-e5large-ckpts/best  (run mrl_e5large training first)
#
# Run 3 — aggressive redistribution + higher dim targets + rebalanced losses
#
#   Run 2 findings (R@10):  Option A=0.5563, Option B=0.5293, MRL=0.5353
#     Per-Bloom: Option B BEATS A on Understand (+7.1), Evaluate (+4.2), ties Apply/Analyze.
#     Entire aggregate gap comes from Remember (-4 pts, 63% of queries) and Create (-4.4 pts).
#     Root cause: Option A's prefix mask selects the most-informative dims (MRL prefix bias).
#     Option B's scattered mask includes less-informative late dims.
#     DropMask 0.1 + dim_redist 0.05 were too conservative to break prefix bias.
#
#   Run 3 changes:
#     1. dropmask_rate: 0.1 → 0.2, dim_redist_weight: 0.05 → 0.2 — 2-4x stronger redistribution
#     2. Per-level targets bumped ~30% — give Option B more dims to compensate for remaining
#        prefix bias. Still 60% compression vs full 1024 dims.
#     3. efficiency_weight: 0.3 → 0.1 — sparsity targets handle compression; efficiency was
#        creating redundant compression pressure on top of sparsity
#     4. mask_distill_weight: 0.3 → 0.5 — stronger quality preservation signal
#     5. Separate 3-stage schedule: warmup=3, differentiation=8. Run 2 had both at 5,
#        so compression + differentiation fired simultaneously. Separating lets the mask
#        converge to target dims (Stage 2) before diversity/variance push masks apart (Stage 3).
#
#   Per-level targets (run 3):
#       Remember:   0.40 → ~410 dims  (run 2: 307 → actual 288)
#       Understand: 0.65 → ~666 dims  (run 2: 573 → actual 586)
#       Apply:      0.38 → ~389 dims  (run 2: 276 → actual 272)
#       Analyze:    0.40 → ~410 dims  (run 2: 287 → actual 264)
#       Evaluate:   0.65 → ~666 dims  (run 2: 573 → actual 595)
#       Create:     0.38 → ~389 dims  (run 2: 276 → actual 271)
#       Average:    ~488 dims (48% compression vs 1024)

model:
  backbone: "intfloat/e5-large-v2"
  embedding_dim: 1024
  pooling: "cls"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 512, 768, 1024]
  use_mask_routing: true             # Option B: BloomMaskHead scattered mask
  mask_sparsity_target: null         # Using per-level targets below
  use_soft_bloom_routing: false      # N/A for Option B

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 7

training:
  seed: 42
  num_epochs: 25
  batch_size: 16
  gradient_accumulation_steps: 8   # effective batch = 128
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-5
    weight_decay: 0.01
    encoder_lr: 2.0e-5
    router_lr: 2.0e-4              # BloomMaskHead — 10x encoder LR
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  loss:
    contrastive_weight: 1.0
    efficiency_weight: 0.1         # Reduced from 0.3 — sparsity targets handle compression,
                                   # efficiency was adding redundant pressure that hurt quality.
    efficiency_uniform_weights: true
    mrl_anchor_weight: 0.0         # 0: MRL anchor reinforces prefix structure — wrong for scatter
    diversity_weight: 0.0          # RouterDiversityLoss is for Option A only
    mask_sparsity_weight: 1.0      # Strong enforcement of per-level targets
    mask_level_targets:            # ~30% higher than run 2 — more dims to compensate for prefix bias
      0: 0.40                      # Remember: ~410 dims (run 2: 307)
      1: 0.65                      # Understand: ~666 dims (run 2: 573)
      2: 0.38                      # Apply: ~389 dims (run 2: 276)
      3: 0.40                      # Analyze: ~410 dims (run 2: 287)
      4: 0.65                      # Evaluate: ~666 dims (run 2: 573)
      5: 0.38                      # Create: ~389 dims (run 2: 276)
    mask_diversity_weight: 0.5
    mask_diversity_margin: 0.0
    mask_variance_weight: 0.3
    mask_distill_weight: 0.5       # Increased from 0.3 — stronger quality preservation.
                                   # Distillation forces masked subspace to preserve full-space
                                   # semantic similarity. With more aggressive DropMask, the
                                   # encoder needs a stronger quality anchor.
    dropmask_rate: 0.2             # Doubled from 0.1. Run 2's 10% wasn't enough to break prefix
                                   # bias — Option B's Remember still 4 pts below Option A.
                                   # 20% forces stronger information redistribution.
    dim_redist_weight: 0.2         # 4x from 0.05. Run 2's var_early was still >> var_late.
                                   # Aggressive penalty to equalize per-dim variance.
    encoder_warmup_epochs: 3       # Reduced from 5 — MRL warm-start gives a head start;
                                   # 3 epochs of pure contrastive is enough before compression.
    mask_differentiation_epochs: 8 # Increased from 5. Run 2 had warmup=5, diff=5 so
                                   # compression + differentiation fired simultaneously.
                                   # Now: Stage 1 [0,3): contrastive + distill + redistrib
                                   #      Stage 2 [3,8): + efficiency + sparsity (compression)
                                   #      Stage 3 [8,25): + diversity + variance (differentiation)
    temperature_schedule:
      start: 0.1
      end: 0.02
    gumbel_temperature_schedule:
      start: 1.0
      end: 0.1
    # bloom_frequencies injected at runtime by train_bam.py
  use_pcgrad: false
  encoder_freeze_after_epochs: null
  bloom_noise_rate: 0.0
  hard_neg_refresh_epochs: null
  checkpoint_dir: "/tmp/bam-b-e5large-ckpts3/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true
  tail_topic_threshold: 20
  measure_latency: true

diagnostics:
  gradient_attribution: true
  num_diagnostic_queries: 1000
  probing:
    probe_type: "linear"
    probe_tasks: ["bloom_level", "subject_area"]
    num_dimension_groups: 8

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
