# BAM Option A — intfloat/e5-large-v2 backbone, MRL warm-start
#
# Routing: BloomDimRouter — learned MLP → scalar dim per Bloom level → prefix binary mask (STE)
# Init encoder: /tmp/mrl-e5large-ckpts/best  (run mrl_e5large training first)
#
# e5-large gives a retrieval-tuned but NOT MRL pre-trained starting point.
# The MRL warm-start (mrl_e5large run) first teaches multi-resolution structure on our
# domain data; Option A then adds Bloom-adaptive dim routing on top of that.
#
# Key differences from BGE-base Option A (configs/bam.yaml):
#   - backbone: intfloat/e5-large-v2 (1024 hidden dim)
#   - embedding_dim: 1024
#   - mrl_dims: [64, 128, 256, 512, 768, 1024]
#   - BloomDimRouter dim range: [170, 1024]  (min_dim = 1024//6 = 170, auto-computed)
#   - MASK_TEMPERATURE: 7.5  (10.0 * 768/1024, auto-computed in BloomDimRouter.__init__)
#   - efficiency_weight: 0.2 (doubled from 0.1 — need enough signal for 1024-dim space)
#   - Everything else same as BGE-base Option A
#
# Run 1

model:
  backbone: "intfloat/e5-large-v2"
  embedding_dim: 1024
  pooling: "cls"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 512, 768, 1024]
  use_mask_routing: false          # Option A: BloomDimRouter prefix mask
  use_soft_bloom_routing: false

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 7

training:
  seed: 42
  num_epochs: 15
  batch_size: 16
  gradient_accumulation_steps: 8   # effective batch = 128
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-5
    weight_decay: 0.01
    encoder_lr: 2.0e-5
    router_lr: 2.0e-4              # BloomDimRouter — 10x encoder LR
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  loss:
    contrastive_weight: 1.0
    efficiency_weight: 0.2         # Doubled from 0.1 — more signal needed for 1024-dim space
    efficiency_uniform_weights: false
    mrl_anchor_weight: 0.2         # Keep encoder sharp at MRL anchor dims
    diversity_weight: 0.0          # Kaiming init — diversity not needed (same as BGE-base final config)
    mask_diversity_weight: 0.0     # Option B only
    mask_sparsity_weight: 0.0      # Option B only
    mask_level_targets: null       # Option B only
    encoder_warmup_epochs: 5       # MRL warm-start: encoder already domain-adapted, 5 epochs enough
    temperature_schedule:
      start: 0.1
      end: 0.02
    # bloom_frequencies injected at runtime by train_bam.py
  use_pcgrad: false
  encoder_freeze_after_epochs: null
  bloom_noise_rate: 0.0
  hard_neg_refresh_epochs: null
  checkpoint_dir: "/tmp/bam-a-e5large-ckpts1/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true
  tail_topic_threshold: 20
  measure_latency: true

diagnostics:
  gradient_attribution: true
  num_diagnostic_queries: 1000
  probing:
    probe_type: "linear"
    probe_tasks: ["bloom_level", "subject_area"]
    num_dimension_groups: 8

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
