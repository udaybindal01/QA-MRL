# BAM Option A — Qwen2.5-7B backbone, MRL warm-start
# Routing: BloomDimRouter — learned MLP → scalar dim per Bloom level → prefix binary mask (STE)
# Init encoder: /tmp/mrl-qwen7b-ckpts/best (run mrl_qwen7b training first)
#
# Key differences from BGE-base Option A (bam.yaml):
#   - backbone: Qwen/Qwen2.5-7B (3584 hidden dim, decoder-only)
#   - pooling: "mean"
#   - mrl_dims: scaled to 3584
#   - BloomDimRouter dim range: [597, 3584] (min_dim = 3584//6 = 597)
#   - num_epochs: 25 (MRL init, but 7B convergence is slower)
#   - encoder_warmup_epochs: 8 (larger model needs more warmup)
#   - batch_size: 4 + grad_accum 32 (7B model memory)
#   - encoder_lr: 1e-5

model:
  backbone: "Qwen/Qwen2.5-7B"
  embedding_dim: 3584
  pooling: "mean"
  normalize_embeddings: true
  mrl_dims: [256, 512, 1024, 1792, 2560, 3584]
  use_mask_routing: false          # Option A: BloomDimRouter prefix mask
  use_soft_bloom_routing: false

data:
  train_path: "./data/real/train_curriculum.jsonl"
  val_path: "./data/real/val.jsonl"
  test_path: "./data/real/test.jsonl"
  corpus_path: "./data/real/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["biology", "chemistry", "physics", "earth_science", "general_science"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 7

training:
  seed: 42
  num_epochs: 25
  batch_size: 4
  gradient_accumulation_steps: 32
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 1.0e-5
    weight_decay: 0.01
    encoder_lr: 1.0e-5
    router_lr: 1.0e-4              # BloomDimRouter — 10x encoder LR
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  loss:
    contrastive_weight: 1.0
    efficiency_weight: 0.2         # Doubled from 0.1 — need enough signal for 3584-dim space
    efficiency_uniform_weights: false
    mrl_anchor_weight: 0.2         # Keep encoder sharp at MRL anchor dims
    diversity_weight: 0.0          # Kaiming init means diversity not needed (same as BGE final config)
    mask_diversity_weight: 0.0     # Option B only
    mask_sparsity_weight: 0.0      # Option B only
    mask_level_targets: null       # Option A only
    encoder_warmup_epochs: 8       # 7B from MRL init still needs longer warmup
    temperature_schedule:
      start: 0.1
      end: 0.02
    # bloom_frequencies injected at runtime by train_bam.py
  use_pcgrad: false
  encoder_freeze_after_epochs: null
  bloom_noise_rate: 0.0
  hard_neg_refresh_epochs: null
  checkpoint_dir: "/tmp/bam-a-qwen7b-ckpts/"
  save_every_n_steps: 500
  eval_every_n_steps: 250

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true
  tail_topic_threshold: 20
  measure_latency: true

diagnostics:
  gradient_attribution: true
  num_diagnostic_queries: 1000
  probing:
    probe_type: "linear"
    probe_tasks: ["bloom_level", "subject_area"]
    num_dimension_groups: 8

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
