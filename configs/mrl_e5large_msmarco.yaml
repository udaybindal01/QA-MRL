# MRL Baseline — intfloat/e5-large-v2 backbone — MS MARCO data
#
# Same architecture as mrl_e5large.yaml but trained on MS MARCO passages.
# This is the shared warm-start for both BAM Option A and Option B.

model:
  backbone: "intfloat/e5-large-v2"
  embedding_dim: 1024
  pooling: "cls"
  normalize_embeddings: true
  mrl_dims: [64, 128, 256, 512, 768, 1024]

data:
  train_path: "/tmp/data/msmarco/train.jsonl"
  val_path: "/tmp/data/msmarco/val.jsonl"
  test_path: "/tmp/data/msmarco/test.jsonl"
  corpus_path: "/tmp/data/msmarco/corpus.jsonl"
  bloom_levels: {1: "Remember", 2: "Understand", 3: "Apply", 4: "Analyze", 5: "Evaluate", 6: "Create"}
  subjects: ["general"]
  max_query_length: 128
  max_passage_length: 256
  num_hard_negatives: 15

training:
  seed: 42
  num_epochs: 15
  batch_size: 16
  gradient_accumulation_steps: 8   # effective batch = 128
  fp16: true
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    lr: 2.0e-5
    weight_decay: 0.01
  scheduler:
    type: "cosine"
    warmup_ratio: 0.1
  checkpoint_dir: "/tmp/mrl-e5large-msmarco-ckpts/"
  save_every_n_steps: 1000
  eval_every_n_steps: 500

evaluation:
  retrieval_ks: [1, 5, 10, 20, 50, 100]
  bloom_stratified: true

logging:
  use_wandb: true
  wandb_project: "bam-emnlp"
  wandb_entity: null
  log_every_n_steps: 10
